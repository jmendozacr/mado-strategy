[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "detector"
version = "0.1.0"
description = "CRT/ICT price-action pattern detector for MT5-exported OHLC data"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "import-linter>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["core", "primitives", "composite", "entries", "alignment", "policy", "backtest", "evaluation", "ingestion", "viz", "selection", "adapter", "causal"]
include = ["cli.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
